[project]
name = "customer-policy-rag"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.4",
    "google-genai>=3.0.0",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.49.0",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.uv]
override-dependencies = [
    "cuda-bindings; sys_platform == 'never'",
    "cuda-pathfinder; sys_platform == 'never'",
    "cuda-toolkit; sys_platform == 'never'",
    "nvidia-cublas; sys_platform == 'never'",
    "nvidia-cuda-cccl; sys_platform == 'never'",
    "nvidia-cuda-nvrtc; sys_platform == 'never'",
    "nvidia-cudnn-cu13; sys_platform == 'never'",
    "nvidia-cusparselt-cu13; sys_platform == 'never'",
    "nvidia-nccl-cu13; sys_platform == 'never'",
    "nvidia-nvshmem-cu13; sys_platform == 'never'",
    "triton; sys_platform == 'never'",
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
